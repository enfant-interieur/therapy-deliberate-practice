name: desktop-release-draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing exact version tag to release, for example v0.1.5"
        required: true
        type: string
      build_run_id:
        description: "Successful desktop-signed-build run for the exact tag"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH to authorize creating the draft GitHub Release"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-draft:
    name: verify and create draft
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require explicit publication confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "PUBLISH" ]]; then
            echo "Confirmation must be exactly PUBLISH." >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.12.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12.13"
      - name: Validate tag and matching build run
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          node services/local-runtime-suite/desktop/scripts/verify-release-config.mjs "$RELEASE_TAG"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100")"
          python - "$run_json" "$artifacts_json" "$tag_sha" <<'PY'
          import json
          import os
          import sys

          run = json.loads(sys.argv[1])
          artifacts = json.loads(sys.argv[2]).get("artifacts", [])
          tag_sha = sys.argv[3]
          repository = run.get("repository") or {}
          expected = {
              "name": "desktop-signed-build",
              "path": ".github/workflows/desktop-signed-build.yml",
              "event": "workflow_dispatch",
              "head_sha": tag_sha,
              "head_branch": os.environ["RELEASE_TAG"],
          }
          for field, value in expected.items():
              if run.get(field) != value:
                  raise SystemExit(
                      f"Selected build run {field} is {run.get(field)!r}; expected {value!r}."
                  )
          if run.get("conclusion") != "success":
              raise SystemExit("Selected desktop-signed-build run did not succeed.")
          if repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("Selected build run belongs to a different repository.")
          if str(repository.get("id")) != os.environ["REPOSITORY_ID"]:
              raise SystemExit("Selected build run repository ID does not match this repository.")
          expected_names = {
              f"desktop-macos-arm64-{tag_sha}",
              f"desktop-macos-intel-{tag_sha}",
              f"desktop-windows-x64-{tag_sha}",
              f"desktop-linux-x64-{tag_sha}",
          }
          actual_names = {
              artifact.get("name")
              for artifact in artifacts
              if not artifact.get("expired")
          }
          if actual_names != expected_names:
              raise SystemExit(
                  f"Selected run artifacts are {sorted(actual_names)}; "
                  f"expected {sorted(expected_names)}."
              )
          PY
          echo "tag_sha=$tag_sha" >> "$GITHUB_OUTPUT"
      - name: Download sealed build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.build_run_id }}" --dir release-artifacts
      - name: Verify signatures, checksums, provenance, and package smokes
        run: >-
          python services/local-runtime-suite/desktop/scripts/verify-release-artifacts.py
          --artifacts release-artifacts
          --tag "${{ inputs.tag }}"
          --source-sha "${{ steps.provenance.outputs.tag_sha }}"
      - name: Verify cryptographic build attestations
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.provenance.outputs.tag_sha }}
          SOURCE_REF: refs/tags/${{ inputs.tag }}
        run: |
          mapfile -t packages < <(
            find release-artifacts -type f \
              \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.msi' -o -name '*-setup.exe' \) \
              -print
          )
          if [[ "${#packages[@]}" -ne 7 ]]; then
            echo "Expected exactly seven attested native packages, found ${#packages[@]}." >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            gh attestation verify "$package" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/desktop-signed-build.yml" \
              --signer-digest "$SOURCE_SHA" \
              --source-ref "$SOURCE_REF" \
              --source-digest "$SOURCE_SHA" \
              --deny-self-hosted-runners
          done
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mapfile -t packages < <(
            find release-artifacts -type f \
              \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.msi' -o -name '*-setup.exe' \) \
              -print
          )
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "No publishable packages were found." >&2
            exit 1
          fi
          python - "${packages[@]}" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          packages = [Path(value) for value in sys.argv[1:]]
          if len({package.name for package in packages}) != len(packages):
              raise SystemExit("Publishable package filenames must be unique.")
          lines = []
          for package in sorted(packages, key=lambda candidate: candidate.name):
              lines.append(f"{sha256_file(package)}  {package.name}")
          Path("release-checksums.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          gh release create "$RELEASE_TAG" "${packages[@]}" release-checksums.txt \
            --verify-tag \
            --draft \
            --title "Local Runtime Suite $RELEASE_TAG" \
            --notes "Verified desktop packages. macOS packages are signed and notarized, Windows packages are signed, and Linux packages are unsigned. Review the attached checksums and build attestations before publishing."
