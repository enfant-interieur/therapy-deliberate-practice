[project]
name = "local-runtime"
version = "0.1.0"
description = "Local runtime gateway for Therapy Studio"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "transformers>=5.14.1,<6",
  "huggingface_hub>=0.24",
  "torch==2.13.0; platform_system != \"Darwin\" or platform_machine == \"arm64\"",
  "accelerate==1.14.0; platform_system != \"Darwin\" or platform_machine == \"arm64\"",
  "jsonschema>=4.22.0",
  "numpy>=2.2.5,<2.5",
  "faster-whisper==1.2.1",
  "onnxruntime==1.23.2",
  "mlx==0.32.0; platform_system == \"Darwin\" and platform_machine == \"arm64\"",
  "mlx-metal==0.32.0; platform_system == \"Darwin\" and platform_machine == \"arm64\"",
  "mlx-lm==0.31.3; platform_system == \"Darwin\" and platform_machine == \"arm64\"",
  "parakeet-mlx==0.5.2; platform_system == \"Darwin\" and platform_machine == \"arm64\"",
  "imageio-ffmpeg==0.6.0; platform_system == \"Darwin\" and platform_machine == \"arm64\"",
  "numba==0.66.0; platform_system == \"Darwin\" and platform_machine == \"arm64\""
]

[project.optional-dependencies]
lint = ["ruff==0.16.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
